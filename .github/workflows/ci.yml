name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes scoped only to the example app or docs don't touch the
    # published package, so they shouldn't run the package's test/publish
    # pipeline. dyanet/imap doesn't do this -- its Dependabot bumps inside
    # examples/gmail-viewer trigger the same full CI + publish-eligibility
    # run as a real library change (see their issue #22, "example code
    # should not trigger @dyanet/imap bump action" -- still open as of
    # this writing). paths-ignore here is the fix for that class of noise.
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"

# Cancel a run if a newer commit lands on the same branch/PR before it
# finishes, instead of letting both run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every Node line's real result. With the default (fail-fast:
      # true) the first version to fail cancels the rest mid-run, so a
      # version-specific failure hides whether the others would have passed --
      # which is exactly the signal a version matrix exists to produce.
      fail-fast: false
      matrix:
        # Every Node.js line still supported as of August 2026: 22
        # (Maintenance LTS), 24 (Active LTS), 26 (Current, becomes Active
        # LTS in October 2026). 18 and 20 are EOL and intentionally
        # excluded -- claiming to "support" them without CI proof isn't
        # actually supporting them. None of 22/24 have native `Temporal`
        # by default, which is exactly what exercises the dependency-free
        # shim in src/temporal/shim.ts; 26 exercises the native path. See
        # docs/temporal-engine-plan.md.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage (Node 24 only)
        if: matrix.node-version == 24
        # v4 still targets the Node 20 runtime, which GitHub is removing in
        # September 2026 -- the first run of this workflow warned about
        # exactly that. v7 is current, matching checkout/setup-node.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # Keeps .github/badges/coverage.svg in step with the real number.
  #
  # Its own job rather than a step in `test` because it needs
  # `contents: write` to push, and the test matrix should stay read-only --
  # three legs with write access racing to commit the same file is both a
  # privilege and a correctness problem.
  coverage-badge:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      - run: npm run test:coverage

      # `[skip ci]` is load-bearing: without it this push retriggers the
      # workflow, which pushes again, forever.
      - name: Commit badge if the number moved
        run: |
          node scripts/coverage-badge.mjs
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "coverage unchanged - nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "Update coverage badge [skip ci]"
          git push

  # The demo site at https://iso-date-demo.dyanet.workers.dev, redeployed on
  # every push to main that reaches it.
  #
  # Deploying on every push to main is correct *here*, and is not the pattern
  # criticised below for `publish`. The difference is idempotence: re-uploading
  # the same static assets under the same Worker name simply replaces them,
  # whereas re-publishing an already-published npm version is rejected outright
  # by the registry. The site should track main; a release should not. Don't
  # "fix" this into tag-gating -- it would just leave the demo stale.
  #
  # `needs: test` for the same reason publish has it: nothing ships from a
  # commit whose tests didn't pass.
  deploy-demo:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Compiles src/ and assembles site-dist/ (index.html + the compiled
      # library, unbundled -- see scripts/build-site.mjs).
      - name: Build demo site
        run: npm run build:site

      # Forks, and this repo before the secrets were added, have no
      # Cloudflare credentials. Skip with a visible notice rather than
      # failing: "the demo didn't deploy" shouldn't render main red and
      # train people to ignore a red main -- which is the same habit the
      # publish-on-every-push problem created in dyanet/imap.
      #
      # The secrets context isn't available in a job-level `if`, so the
      # check has to happen in a step.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - skipping the demo deploy. See docs/cloudflare-demo.md."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Publishing only runs off an explicit version tag (e.g. `v0.1.1`), never
  # off every push to main. dyanet/imap's CI publishes on every push to main
  # regardless of whether package.json's version changed, so once a version
  # is published, the very next commit's publish step fails with
  # "cannot publish over previously published version" (npm/GitHub Packages
  # reject re-publishing an existing version). Tag-gating means a publish
  # only happens when someone deliberately cuts a release (bump version,
  # `git tag vX.Y.Z`, push the tag), which keeps main green.
  #
  # `needs: test` means a broken build/test run can never reach publish --
  # closing the gap in dyanet/imap's own issue #23 ("Include tests in
  # builds"), where a separate Docker-based build path for their example
  # app doesn't run the main package's test suite before building.
  publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Publishes to GitHub Packages, not npmjs.com. The @dyanet scope
      # matches the org that owns this repo, which is what GitHub Packages
      # requires, and auth is the workflow's own GITHUB_TOKEN (via the
      # `packages: write` permission above) -- so there is no long-lived
      # publish token to create, store, or rotate.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@dyanet"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
