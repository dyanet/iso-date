name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Changes scoped only to the example app or docs don't touch the
    # published package, so they shouldn't run the package's test/publish
    # pipeline. dyanet/imap doesn't do this -- its Dependabot bumps inside
    # examples/gmail-viewer trigger the same full CI + publish-eligibility
    # run as a real library change (see their issue #22, "example code
    # should not trigger @dyanet/imap bump action" -- still open as of
    # this writing). paths-ignore here is the fix for that class of noise.
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "examples/**"
      - "docs/**"
      - "**.md"

# Cancel a run if a newer commit lands on the same branch/PR before it
# finishes, instead of letting both run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every Node line's real result. With the default (fail-fast:
      # true) the first version to fail cancels the rest mid-run, so a
      # version-specific failure hides whether the others would have passed --
      # which is exactly the signal a version matrix exists to produce.
      fail-fast: false
      matrix:
        # Every Node.js line still supported as of August 2026: 22
        # (Maintenance LTS), 24 (Active LTS), 26 (Current, becomes Active
        # LTS in October 2026). 18 and 20 are EOL and intentionally
        # excluded -- claiming to "support" them without CI proof isn't
        # actually supporting them. None of 22/24 have native `Temporal`
        # by default, which is exactly what exercises the dependency-free
        # shim in src/temporal/shim.ts; 26 exercises the native path. See
        # docs/temporal-engine-plan.md.
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the build on a known high/critical advisory in anything that
      # ships to users. Dev-only advisories are left to Dependabot so a
      # test-tool CVE can't block a release of unaffected runtime code.
      - name: Audit runtime dependencies
        if: matrix.node-version == 24
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      # The committed badge is informational, so this reports drift without
      # failing. It deliberately does not commit: pushing to main from CI
      # needs write access the test matrix shouldn't have, and on a repo
      # with a "changes must go through a pull request" ruleset the push is
      # rejected outright. Refresh it with `npm run coverage:badge`.
      - name: Check coverage badge is current (Node 24 only)
        if: matrix.node-version == 24
        run: |
          node scripts/coverage-badge.mjs
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "coverage badge is current"
          else
            echo "::notice::Coverage moved since the badge was generated. Run \`npm run coverage:badge\` and commit .github/badges/coverage.svg."
            git --no-pager diff --stat -- .github/badges/coverage.svg
          fi

      - name: Upload coverage (Node 24 only)
        if: matrix.node-version == 24
        # v4 still targets the Node 20 runtime, which GitHub is removing in
        # September 2026 -- the first run of this workflow warned about
        # exactly that. v7 is current, matching checkout/setup-node.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  # The demo site at https://iso-date-demo.dyanet.workers.dev, redeployed on
  # every push to main that reaches it.
  #
  # Deploying on every push to main is correct *here*, and is not the pattern
  # criticised below for `publish`. The difference is idempotence: re-uploading
  # the same static assets under the same Worker name simply replaces them,
  # whereas re-publishing an already-published npm version is rejected outright
  # by the registry. The site should track main; a release should not. Don't
  # "fix" this into tag-gating -- it would just leave the demo stale.
  #
  # `needs: test` for the same reason publish has it: nothing ships from a
  # commit whose tests didn't pass.
  deploy-demo:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Compiles src/ and assembles site-dist/ (index.html + the compiled
      # library, unbundled -- see scripts/build-site.mjs).
      - name: Build demo site
        run: npm run build:site

      # Forks, and this repo before the secrets were added, have no
      # Cloudflare credentials. Skip with a visible notice rather than
      # failing: "the demo didn't deploy" shouldn't render main red and
      # train people to ignore a red main -- which is the same habit the
      # publish-on-every-push problem created in dyanet/imap.
      #
      # The secrets context isn't available in a job-level `if`, so the
      # check has to happen in a step.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - skipping the demo deploy. See docs/cloudflare-demo.md."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Publishing only runs off an explicit version tag (e.g. `v0.1.1`), never
  # off every push to main. dyanet/imap's CI publishes on every push to main
  # regardless of whether package.json's version changed, so once a version
  # is published, the very next commit's publish step fails with
  # "cannot publish over previously published version" (npm/GitHub Packages
  # reject re-publishing an existing version). Tag-gating means a publish
  # only happens when someone deliberately cuts a release (bump version,
  # `git tag vX.Y.Z`, push the tag), which keeps main green.
  #
  # `needs: test` means a broken build/test run can never reach publish --
  # closing the gap in dyanet/imap's own issue #23 ("Include tests in
  # builds"), where a separate Docker-based build path for their example
  # app doesn't run the main package's test suite before building.
  publish:
    needs: test
    runs-on: ubuntu-latest
    # Releases happen two ways:
    #  - a pushed v* tag (as before), or
    #  - merging a version bump to main: on a push to main this job checks
    #    whether v<package.json version> is already tagged, and does nothing
    #    if it is. So ordinary commits are a no-op (not a red "cannot publish
    #    over" failure), and a PR that bumps the version releases on merge.
    #    The job tags the commit itself afterwards; a tag pushed with
    #    GITHUB_TOKEN does not re-trigger workflows, so there is no double run.
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: write # to tag the release commit
      packages: write
      id-token: write # npm Trusted Publishing (OIDC) and provenance

    steps:
      - uses: actions/checkout@v7

      # Publishes to GitHub Packages, not npmjs.com. The @dyanet scope
      # matches the org that owns this repo, which is what GitHub Packages
      # requires, and auth is the workflow's own GITHUB_TOKEN (via the
      # `packages: write` permission above) -- so there is no long-lived
      # publish token to create, store, or rotate.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"
          scope: "@dyanet"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Decide whether to release
        id: rel
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$PKG_VERSION" >/dev/null; then
            echo "v$PKG_VERSION is already tagged - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$PKG_VERSION is not tagged yet - releasing it."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.rel.outputs.release == 'true'
        run: npm run build

      # Both publish steps below check first and skip if that exact version
      # already exists on that registry.
      #
      # Without the check, re-running a tag is fatal rather than a no-op:
      # force-updating the v0.1.0 tag retriggered this job and it died on
      # "cannot publish over the previously published versions: 0.1.0". A
      # release job should be safe to re-run -- the desired end state is
      # "this version is on the registry", which is already true.
      #
      # It also means the two registries can drift apart (one succeeded, one
      # didn't) and a re-run repairs only the one that's behind.
      - name: Publish to GitHub Packages
        if: steps.rel.outputs.release == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on GitHub Packages - skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This writes its own npmrc instead of passing --registry. setup-node
      # above put `@dyanet:registry=https://npm.pkg.github.com` in the
      # default npmrc, and for a *scoped* package that mapping beats the
      # --registry flag: the first attempt at this step sent the tarball to
      # npm.pkg.github.com and died on a 401, while claiming to publish to
      # npmjs. A dedicated userconfig has no scope mapping to lose to.
      #
      # Auth, in order of preference:
      #  1. npm Trusted Publishing (OIDC, via `id-token: write` above). Once
      #     this repo + workflow is registered as a trusted publisher for the
      #     package on npmjs.com, npm uses it and no long-lived token is
      #     needed -- so there is nothing to expire. (A granular write token
      #     expiring is what broke the September 2026 releases.)
      #  2. The NPM_TOKEN secret, if set.
      # --provenance links the published tarball to this workflow run.
      - name: Publish to npmjs
        if: steps.rel.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Trusted publishing needs npm >= 11.5.1.
          if ! npx -y semver -r ">=11.5.1" "$(npm -v)" >/dev/null; then
            npm install -g npm@^11.5.1
          fi

          NPMRC="$RUNNER_TEMP/.npmrc-npmjs"
          umask 077
          {
            echo "registry=https://registry.npmjs.org/"
            echo "@dyanet:registry=https://registry.npmjs.org/"
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN"
            fi
          } > "$NPMRC"

          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version --userconfig "$NPMRC" >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npmjs - skipping."
          elif ! npm publish --userconfig "$NPMRC" --access public --provenance; then
            echo "::error::npmjs rejected the publish. Configure npm Trusted Publishing for $NAME (npmjs.com > package > Settings > Trusted publishing: GitHub Actions, repo ${GITHUB_REPOSITORY}, workflow $(basename "${GITHUB_WORKFLOW_REF%@*}")) or renew the NPM_TOKEN secret, then re-run this job."
            rm -f "$NPMRC"
            exit 1
          fi

          rm -f "$NPMRC"

      - name: Tag the release commit
        if: steps.rel.outputs.release == 'true' && github.ref == 'refs/heads/main'
        run: |
          TAG="v${{ steps.rel.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
